<div class="field{% if campo.errors %} has-err{% endif %}">
  {% if campo.field.widget.input_type == "checkbox" %}
    <label class="check" for="{{ campo.id_for_label }}">{{ campo }} {{ campo.label }}</label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% for e in campo.errors %}<div class="err" role="alert">{{ e }}</div>{% endfor %}
  {% if campo.help_text %}<div class="help">{{ campo.help_text|safe }}</div>{% endif %}
</div>
