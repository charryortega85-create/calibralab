{% if is_paginated %}
<nav class="pager" aria-label="Páginas">
  {% if page_obj.has_previous %}<a class="btn sm" href="?{% if consulta %}{{ consulta }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn sm" href="?{% if consulta %}{{ consulta }}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}
</nav>
{% endif %}
