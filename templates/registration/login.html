{% extends "registration/_ingreso_base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block panel %}
      <h1>Bienvenido</h1>
      <p class="ingreso-sub">Ingresa con tu usuario y contraseña personales.</p>
      {% for m in messages %}<div class="msg {{ m.tags }}" role="status">{{ m }}</div>{% endfor %}
      <form method="post" class="form" novalidate>
        {% include "_form.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn primary ingreso-btn" type="submit">Ingresar<svg class="i" aria-hidden="true"><use href="#i-chevron"/></svg></button>
      </form>
      <p class="ingreso-ayuda"><svg class="i" aria-hidden="true"><use href="#i-key"/></svg><a class="link" href="{% url 'cuentas:olvide' %}">¿Olvidaste tu contraseña?</a></p>
{% endblock %}
